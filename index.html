<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Pereira · gemelo digital</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101311; overflow: hidden;
                   font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8ece8; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
                      background: #101311; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 14px; background: #101311;
                 transition: opacity .4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
      #loading p { margin: 0; color: #9aa59d; font-size: 13px; }
      #bar { width: min(320px, 70vw); height: 4px; border-radius: 2px; background: #243028; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #4ec28a; transition: width .15s; }
      #error { display: none; max-width: 420px; text-align: center; color: #f0b4a8; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Pereira · gemelo digital</h1>
      <div id="bar"><div id="fill"></div></div>
      <p id="status">Cargando datos de la ciudad…</p>
      <p id="error"></p>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const fill = document.getElementById("fill");
      const status = document.getElementById("status");
      const err = document.getElementById("error");

      const files = [
        "Build/WebGL.data.unityweb",
        "Build/WebGL.framework.js.unityweb",
        "Build/WebGL.wasm.unityweb",
      ];

      // Total download size, from the headers; 0 when the host does not say.
      let totalMb = 0;
      Promise.all(files.map((f) => fetch(f, { method: "HEAD" })
        .then((r) => +r.headers.get("content-length") || 0).catch(() => 0)))
        .then((sizes) => { totalMb = sizes.reduce((a, b) => a + b, 0) / 1048576; });

      // Unity reports 0..0.9 while downloading, then 0.9..1 while it unpacks
      // the data and starts the engine; the scene start-up comes after 1.
      function show(p) {
        if (p >= 1) {
          status.textContent = "Preparando la ciudad (170 000 edificios)…";
        } else if (p >= 0.9) {
          status.textContent = "Descomprimiendo y arrancando el motor…";
        } else {
          const got = p / 0.9;
          status.textContent = totalMb > 0
            ? "Descargando la ciudad… " + Math.round(got * totalMb) + " de " + Math.round(totalMb) + " MB"
            : "Descargando la ciudad… " + Math.round(got * 100) + " %";
        }
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: files[0],
        frameworkUrl: files[1],
        codeUrl: files[2],
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Pereira Twin",
        productName: "Pereira digital twin",
        productVersion: "0.1.0",
      }, (p) => {
        fill.style.width = Math.round(p * 90) + "%";   // the last 10 % is scene start-up
        show(p);
      }).then(() => {
        fill.style.width = "100%";
        document.getElementById("loading").classList.add("done");
      }).catch((e) => {
        status.style.display = "none";
        err.style.display = "block";
        err.textContent = "No se pudo iniciar el visor. Se necesita un navegador con WebGL 2 " +
                          "y memoria libre suficiente. Detalle: " + e;
      });
    </script>
  </body>
</html>
